name: Anteprime Gazzetta
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: gazzetta
  cancel-in-progress: false
jobs:
  anteprime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.0.0
      - run: python .github/og/gazzetta.py
      - name: Pubblica se qualcosa è cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A gu
          if git diff --cached --quiet; then echo "nessuna novità"; exit 0; fi
          git commit -m "Gazzetta: anteprime aggiornate"
          git push
          curl -sS -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
